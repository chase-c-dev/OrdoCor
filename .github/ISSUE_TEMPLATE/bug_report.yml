name: Bug report
description: Report a reproducible problem in OrdoCor.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for the issue to be reproduced.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, package version, or commit are you using?
      placeholder: v1.2.3 or a commit SHA
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and any relevant runtime details.
      placeholder: Windows 11, Python 3.12
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs, tracebacks, or screenshots.
      render: shell
    validations:
      required: false
